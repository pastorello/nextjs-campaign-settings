version: 2
updates:
  # npm package updates
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    # Group same-major version bumps together to reduce PR noise.
    # Excluded packages require a human to read the changelog and are handled
    # separately per CLAUDE.md rule 7.
    groups:
      # prisma (the CLI/generator, a devDependency) and @prisma/client /
      # @prisma/adapter-pg (prod dependencies) must move in lockstep — Prisma
      # requires the generator and the client runtime to match, and a
      # generator/runtime version mismatch produces a broken build (missing
      # query-compiler WASM module), not just a lint warning. A single group
      # spanning both dependency types keeps them bumped together in one PR
      # instead of two independent ones that each break the build alone.
      prisma:
        applies-to: version-updates
        patterns:
          - prisma
          - "@prisma/*"
      dev-dependencies:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        exclude-patterns:
          - typescript
          - eslint
          - prisma
      prod-dependencies:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - next
          - react
          - "@prisma/*"
    # Never bump major versions of these — they need human changelog reads.
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: prisma
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
