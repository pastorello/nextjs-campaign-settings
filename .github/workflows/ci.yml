name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis — fast, no database. Fails the PR before anything expensive.
  # ---------------------------------------------------------------------------
  static:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads this through env(), so `prisma generate` refuses
      # to load its config without it — even though this job never opens a
      # connection. It only has to be present and well-formed, not reachable.
      DATABASE_URL: postgresql://admin:postgres@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: action-setup reads package.json's
      # `packageManager` field, so CI and a developer machine cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  # ---------------------------------------------------------------------------
  # Unit and integration tests against a real Postgres.
  # Mocking Prisma would test the mock, not the query. See docs/TESTING.md.
  # ---------------------------------------------------------------------------
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign_settings_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://admin:postgres@localhost:5432/campaign_settings_test
      DATABASE_URL: postgresql://admin:postgres@localhost:5432/campaign_settings_test
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: action-setup reads package.json's
      # `packageManager` field, so CI and a developer machine cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations
        run: pnpm prisma migrate deploy

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Production build. Catches errors that only appear outside dev mode.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: static
    env:
      DATABASE_URL: postgresql://admin:postgres@localhost:5432/placeholder
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: action-setup reads package.json's
      # `packageManager` field, so CI and a developer machine cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

  # ---------------------------------------------------------------------------
  # End-to-end. Slowest job, so it runs only once the cheaper ones are green.
  #
  # NON-BLOCKING until TD-24. Playwright is not a dependency, there is no
  # playwright.config.ts and no specs exist, so `pnpm test:e2e` is undefined and
  # this job cannot pass. `continue-on-error` keeps the overall run green rather
  # than reporting a red nobody can act on yet — the four gates that do block
  # (static, test, build) are the real Phase 1 exit criteria.
  #
  # TD-24 installs Playwright and the eight critical-flow specs, and its final
  # step is to delete the `continue-on-error` line below so this job blocks
  # again. Scheduled after TD-01 and TD-02 — the auth and validation flows the
  # specs assert must exist and be stable first. See docs/TECH_DEBT.md TD-24 and
  # docs/TESTING.md §E2E. Do not delete the job; do not expect it to pass yet.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [static, test]
    # Remove this line as the last step of TD-24, once the specs exist.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign_settings_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: postgres://admin:postgres@localhost:5432/campaign_settings_e2e
      DATABASE_URL: postgresql://admin:postgres@localhost:5432/campaign_settings_e2e
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: action-setup reads package.json's
      # `packageManager` field, so CI and a developer machine cannot drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply migrations and seed
        run: |
          pnpm prisma migrate deploy
          pnpm db:seed

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
